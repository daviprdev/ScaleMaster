services:
  rpa-worker:
    build: .
    restart: always
    env_file: .env
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
    volumes:
      - ./profiles:/opt/rpa/profiles
      - ./data:/app/data
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3