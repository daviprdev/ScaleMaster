services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_INSTAGRAM_APP_ID: ${NEXT_PUBLIC_INSTAGRAM_APP_ID:-}
        NEXT_PUBLIC_META_CLIENT_ID: ${NEXT_PUBLIC_META_CLIENT_ID:-}
    image: autoscale-app:latest
    container_name: autoscale-app-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # P1 CORREÇÃO: Healthcheck usando Node (já disponível) em vez de wget/curl.
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:3000/api/health', {timeout: 5000}, (res) => { let data = ''; res.on('data', chunk => data += chunk); res.on('end', () => process.exit(res.statusCode === 200 ? 0 : 1)); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      python-server:
        condition: service_healthy

  python-server:
    build:
      context: ./python_server
    image: autoscale-python-server:latest
    container_name: autoscale-python-server-1
    restart: unless-stopped
    # Não expor porta publicamente — apenas a rede interna do compose.
    # O app Next.js acessa via http://python-server:8000.
    expose:
      - "8000"
    environment:
      - PORT=8000
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - PYTHON_SERVER_SECRET=${PYTHON_SERVER_SECRET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"