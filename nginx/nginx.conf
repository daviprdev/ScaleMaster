upstream autoscale_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates (Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/autoscale-ia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoscale-ia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Health check endpoint — no access log noise
    location /api/health {
        proxy_pass http://autoscale_app;
        access_log off;
    }

    # Cron endpoints: restrict to localhost only (defense in depth alongside CRON_SECRET)
    location /api/cron/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://autoscale_app;
    }

    location /api/analytics/sync {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://autoscale_app;
    }

    # Main application
    location / {
        proxy_pass http://autoscale_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 500M;
    }
}