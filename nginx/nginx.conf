# Espelho de /etc/nginx/sites-enabled/scalemaster.tech na VPS (fonte da verdade
# é o servidor; mantenha este arquivo igual ao que está em produção).

# ── Rate limiting ────────────────────────────────────────────
# As zonas ficam aqui porque este arquivo é incluído dentro de http {}.
# Chave = IP do cliente: o Nginx é a borda (DNS aponta direto para a VPS, sem CDN).
# Login por username e retorno do OAuth: cada requisição chama o endpoint de
# token do Supabase saindo do IP da VPS (limite dele: 150/5 min por IP, o mesmo
# que o refresh de sessão usa). sm_login_all é um teto global para um ataque de
# vários IPs não esgotar esse limite e derrubar a sessão de todo mundo.
limit_req_zone $binary_remote_addr zone=sm_login:10m     rate=6r/m;
limit_req_zone $server_name        zone=sm_login_all:1m  rate=15r/m;
limit_req_zone $binary_remote_addr zone=sm_auth:10m      rate=10r/m;
# Iniciar busca de perfil gasta crédito na HikerAPI/Apify (clique manual).
limit_req_zone $binary_remote_addr zone=sm_scrape:10m    rate=10r/m;
# Polling dessas buscas: o front consulta a cada 4–5 s por busca aberta.
limit_req_zone $binary_remote_addr zone=sm_poll:10m      rate=120r/m;
limit_req_zone $binary_remote_addr zone=sm_video:10m     rate=20r/m;

server {
    listen 80;
    server_name scalemaster.tech;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name scalemaster.tech;
    ssl_certificate /etc/letsencrypt/live/scalemaster.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scalemaster.tech/privkey.pem;
    # Vídeos e mídias sobem direto para o Supabase (URL assinada); pelo Next só
    # passa o upload de avatar (máx. 5 MB, /api/profile/avatar).
    client_max_body_size 10M;

    limit_req_status 429;
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Muitas requisições. Aguarde um pouco e tente de novo."}';
    }

    # Proxy para o Next.js, herdado pelas locations que não redefinem.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Por IP: 10 tentativas de cara, depois 1 a cada 10 s.
    location = /api/auth/login {
        limit_req zone=sm_login burst=10 nodelay;
        limit_req zone=sm_login_all burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /auth/callback {
        limit_req zone=sm_login burst=10 nodelay;
        limit_req zone=sm_login_all burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/auth/ {
        limit_req zone=sm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # POST /api/inspirations/scrape, /api/inspirations/scrape-account, /api/clone/search
    location ~ ^/api/(inspirations/scrape(-account)?|clone/search)$ {
        limit_req zone=sm_scrape burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # .../poll, /pending, /dismiss, /recover
    location ~ ^/api/(inspirations/scrape(-account)?|clone/search)/ {
        limit_req zone=sm_poll burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /api/video/process {
        limit_req zone=sm_video burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/api/cron/(?!force-run) {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cron/force-run {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
